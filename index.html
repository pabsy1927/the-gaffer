// ── Stats ─────────────────────────────────────────────────────────────────────
function buildStats(){
  const wrap=div({});
  wrap.appendChild(div({style:{fontSize:"20px",fontWeight:800,marginBottom:"18px"}},"Squad Stats"));
  const grid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"4px"}});
  [{l:"APPEARANCES",v:S.players.reduce((s,p)=>s+p.games,0),c:BLUE},{l:"SESSIONS",v:S.sessions.length,c:"#22c55e"},{l:"FLOAT",v:"£"+S.float.toFixed(0),c:S.float>=0?"#22c55e":RED}].forEach(x=>{
    grid.appendChild(div({style:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:"12px",padding:"13px 0",textAlign:"center"}},[div({style:{fontSize:"22px",fontWeight:800,color:x.c}},String(x.v)),div({style:{fontSize:"9px",color:"rgba(255,255,255,0.4)",letterSpacing:"1px",padding:"0 4px"}},x.l)]));
  });
  wrap.appendChild(grid);

  wrap.appendChild(sLabel("🏆 Most Appearances"));
  const sorted=[...S.players].sort((a,b)=>b.games-a.games);
  const maxG=sorted.length?sorted[0].games:1;
  sorted.forEach((p,i)=>{
    const row=div({style:{display:"flex",alignItems:"center",gap:"11px",padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}});
    row.appendChild(div({style:{width:"24px",fontWeight:800,fontSize:"15px",color:["#f59e0b","#94a3b8","#cd7c4a"][i]||"rgba(255,255,255,0.2)"}},"#"+(i+1)));
    row.appendChild(div({style:{width:"30px",height:"30px",borderRadius:"7px",background:pc(p.pos)+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",fontWeight:800,color:pc(p.pos)}},p.pos));
    row.appendChild(div({style:{flex:1,fontWeight:700}},p.name));
    const barWrap=div({style:{display:"flex",alignItems:"center",gap:"6px"}});
    const barBg=div({style:{width:"70px",height:"5px",background:"rgba(255,255,255,0.08)",borderRadius:"3px",overflow:"hidden"}});
    barBg.appendChild(div({style:{height:"100%",width:Math.max(2,p.games/maxG)*100+"%",background:BLUE,borderRadius:"3px"}}));
    barWrap.appendChild(barBg);barWrap.appendChild(span({style:{fontWeight:800,color:BLUE,minWidth:"24px",textAlign:"right"}},String(p.games)));
    row.appendChild(barWrap);wrap.appendChild(row);
  });

  if(S.isGaffer){
    wrap.appendChild(sLabel("⭐ Skill Rankings"));
    [...S.players].sort((a,b)=>b.skill-a.skill).forEach((p,i)=>{
      const row=div({style:{display:"flex",alignItems:"center",gap:"11px",padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}});
      row.appendChild(div({style:{width:"24px",fontWeight:800,fontSize:"15px",color:["#f59e0b","#94a3b8","#cd7c4a"][i]||"rgba(255,255,255,0.2)"}},"#"+(i+1)));
      row.appendChild(div({style:{width:"30px",height:"30px",borderRadius:"7px",background:pc(p.pos)+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",fontWeight:800,color:pc(p.pos)}},p.pos));
      const info=div({style:{flex:1}});info.appendChild(div({style:{fontWeight:700,marginBottom:"4px"}},p.name));info.appendChild(skillDots(p.skill));
      row.appendChild(info);row.appendChild(span({style:{fontSize:"17px",fontWeight:800,color:"#f59e0b"}},String(p.skill)));
      wrap.appendChild(row);
    });
  }

  wrap.appendChild(sLabel("🏟️ Position Breakdown"));
  const posGrid=div({style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"8px",marginBottom:"20px"}});
  ["GK","DEF","MID","FWD","ANY"].forEach(pos=>{
    const n=S.players.filter(p=>p.pos===pos).length;
    posGrid.appendChild(div({style:{background:pc(pos)+"10",border:"1px solid "+pc(pos)+"30",borderRadius:"11px",padding:"11px 0",textAlign:"center"}},[div({style:{fontSize:"20px",fontWeight:800,color:pc(pos)}},String(n)),div({style:{fontSize:"10px",color:"rgba(255,255,255,0.4)"}},pos)]));
  });
  wrap.appendChild(posGrid);

  if(S.sessions.length>0){
    const counts={};S.sessions.forEach(s=>{const m=s.date&&s.date.slice(0,7);if(m)counts[m]=(counts[m]||0)+1;});
    const mx=Math.max(...Object.values(counts));
    wrap.appendChild(sLabel("📅 Sessions Per Month"));
    Object.entries(counts).sort().forEach(([m,n])=>{
      const row=div({style:{display:"flex",alignItems:"center",gap:"11px",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}});
      row.appendChild(div({style:{width:"80px",fontSize:"12px",color:"rgba(255,255,255,0.45)"}},new Date(m+"-15").toLocaleDateString("en-GB",{month:"short",year:"numeric"})));
      const bar=div({style:{flex:1,height:"7px",background:"rgba(255,255,255,0.08)",borderRadius:"4px",overflow:"hidden"}});
      bar.appendChild(div({style:{height:"100%",width:(n/mx)*100+"%",background:"#22c55e",borderRadius:"4px"}}));
      row.appendChild(bar);row.appendChild(div({style:{fontWeight:800,color:"#22c55e",minWidth:"18px"}},String(n)));
      wrap.appendChild(row);
    });
  }
  return wrap;
}

// ── Poll View (for players) ───────────────────────────────────────────────────
async function renderPoll(pollId){
  const root=document.getElementById("root");
  root.innerHTML="<div style='display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px'><div style='font-size:44px'>⚽</div><div style='color:#00e676;letter-spacing:3px'>Loading poll...</div></div>";

  const poll=await DB.get("shared/poll_"+pollId,null);
  const players=await DB.get("private/players",[]);
  const activePl=(Array.isArray(players)?players:[]).filter(p=>p.active);

  if(!poll){root.innerHTML="<div style='display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;color:#fff;text-align:center;padding:24px'><div style='font-size:52px'>❌</div><div style='font-size:24px;font-weight:800'>Poll not found</div><div style='color:rgba(255,255,255,0.4)'>This poll may have been closed.</div></div>";return;}

  let votes={};
  function buildPollUI(){
    const inC=Object.values(votes).filter(v=>v==="in").length;
    const outC=Object.values(votes).filter(v=>v==="out").length;
    const wrap=div({style:{minHeight:"100vh",background:"#0a0f1a"}});
    const hdr=div({style:{background:"linear-gradient(135deg,#0c1e10,#0a0f1a)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"24px 20px"}});
    const hi=div({style:{maxWidth:"480px",margin:"0 auto"}});
    hi.appendChild(div({style:{fontSize:"10px",letterSpacing:"4px",color:"#00e676",marginBottom:"4px"}},"⚽ THE GAFFER"));
    hi.appendChild(div({style:{fontSize:"28px",fontWeight:900}},poll.title));
    hi.appendChild(div({style:{fontSize:"14px",color:"rgba(255,255,255,0.45)",marginTop:"4px"}},poll.date));
    hdr.appendChild(hi);wrap.appendChild(hdr);
    const body=div({style:{maxWidth:"480px",margin:"0 auto",padding:"20px 16px 60px"}});
    const grid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"22px"}});
    [[inC,"IN ✅","rgba(34,197,94,0.1)","rgba(34,197,94,0.3)","#22c55e"],[outC,"OUT ❌","rgba(239,68,68,0.1)","rgba(239,68,68,0.3)",RED]].forEach(([v,l,bg,bc,c])=>{
      grid.appendChild(div({style:{background:bg,border:"1px solid "+bc,borderRadius:"14px",padding:"16px 0",textAlign:"center"}},[div({style:{fontSize:"36px",fontWeight:900,color:c}},String(v)),div({style:{fontSize:"11px",color:"rgba(255,255,255,0.5)",letterSpacing:"1px"}},l)]));
    });
    body.appendChild(grid);
    body.appendChild(div({style:{fontSize:"13px",color:"rgba(255,255,255,0.4)",marginBottom:"16px",textAlign:"center"}},"Tap your name then your answer — updates instantly 🔄"));
    activePl.forEach(p=>{
      const v=votes[p.id];
      const card=div({style:{background:v==="in"?"rgba(34,197,94,0.08)":v==="out"?"rgba(239,68,68,0.08)":"rgba(255,255,255,0.04)",border:"1px solid "+(v==="in"?"rgba(34,197,94,0.3)":v==="out"?"rgba(239,68,68,0.3)":"rgba(255,255,255,0.08)"),borderRadius:"13px",padding:"14px 16px",marginBottom:"10px"}});
      const row=div({style:{display:"flex",alignItems:"center",gap:"12px"}});
      row.appendChild(div({style:{width:"40px",height:"40px",borderRadius:"10px",background:pc(p.pos)+"18",border:"2px solid "+pc(p.pos)+"45",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:800,color:pc(p.pos),flexShrink:0}},p.pos));
      const info=div({style:{flex:1}});
      info.appendChild(div({style:{fontWeight:800,fontSize:"17px"}},p.name));
      info.appendChild(div({style:{fontSize:"12px",color:v==="in"?"#22c55e":v==="out"?RED:"rgba(255,255,255,0.3)",marginTop:"2px",fontWeight:700}},v==="in"?"✅ In":v==="out"?"❌ Out":"Not voted yet"));
      row.appendChild(info);
      const vb=div({style:{display:"flex",gap:"8px",flexShrink:0}});
      ["in","out"].forEach(val=>{
        const vbtn=btn({onclick:async()=>{votes={...votes,[p.id]:val};await DB.set("shared/votes_"+pollId,votes);root.innerHTML="";root.appendChild(buildPollUI());},style:{background:v===val?(val==="in"?"#22c55e":RED):(val==="in"?"rgba(34,197,94,0.15)":"rgba(239,68,68,0.15)"),color:v===val?(val==="out"?"#fff":"#000"):(val==="in"?"#22c55e":RED),border:"none",borderRadius:"9px",padding:"10px 18px",fontWeight:800,fontSize:"14px",cursor:"pointer",fontFamily:"inherit",minWidth:"52px"}},val==="in"?"IN":"OUT");
        vb.appendChild(vbtn);
      });
      row.appendChild(vb);card.appendChild(row);body.appendChild(card);
    });
    const inNames=activePl.filter(p=>votes[p.id]==="in");
    if(inNames.length>0){
      const box=div({style:{marginTop:"16px",background:"rgba(34,197,94,0.06)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:"13px",padding:"16px"}});
      box.appendChild(div({style:{fontSize:"11px",letterSpacing:"2px",color:"#22c55e",marginBottom:"8px"}},"✅ IN SO FAR"));
      const chips=div({style:{display:"flex",flexWrap:"wrap",gap:"7px"}});
      inNames.forEach(p=>chips.appendChild(span({style:{background:"rgba(34,197,94,0.15)",color:"#22c55e",border:"1px solid rgba(34,197,94,0.3)",padding:"4px 12px",borderRadius:"20px",fontSize:"13px",fontWeight:700}},p.name)));
      box.appendChild(chips);body.appendChild(box);
    }
    body.appendChild(div({style:{marginTop:"20px",textAlign:"center",fontSize:"12px",color:"rgba(255,255,255,0.2)"}},"Powered by The Gaffer ⚽"));
    wrap.appendChild(body);return wrap;
  }

  // Live updates
  votes=await DB.get("shared/votes_"+pollId,{});
  root.innerHTML="";root.appendChild(buildPollUI());
  DB.on("shared/votes_"+pollId,v=>{votes=v||{};root.innerHTML="";root.appendChild(buildPollUI());});
}
